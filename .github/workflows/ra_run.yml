name: RA

on:
  schedule:
    # 04:00 UTC = 05:00 по польскому времени (зимнее время)
    # Запуск каждого 2-го числа месяца
    - cron: '0 4 */2 * *'
  
  workflow_dispatch:
    # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5  # Поддержка Node 24

      - name: Set up Python
        uses: actions/setup-python@v6 # Поддержка Node 24
        with:
          python-version: '3.11'

      # Мы создаем файл именно с тем именем, которое прописано у вас в коде ra.py
      - name: Decode Google Credentials
        run: echo "${{ secrets.G_KEYS_BASE64 }}" | base64 --decode > silken-glyph-443313-i4-cdf14b36288a.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client pandas
          playwright install chromium --with-deps

      - name: Run Python script
        run: python ra.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: silken-glyph-443313-i4-cdf14b36288a.json
